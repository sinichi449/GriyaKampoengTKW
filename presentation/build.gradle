plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
    id 'com.google.dagger.hilt.android'
}

android {
    namespace 'net.bagusekasaputra.griyakampoengtkw.presentation'
    compileSdk 33

    defaultConfig {
        minSdk 21
        targetSdk 33

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    flavorDimensions 'distribution'
    productFlavors {
        stable {
            dimension 'distribution'
        }
        developer {
            dimension 'distribution'
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // kotlinOptions {
    //     jvmTarget = '1.8'
    // }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation project(path: ':domain')
    implementation files('libs/poi-3.7.jar')

    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.5.1'
    implementation 'com.google.android.material:material:1.7.0'
    implementation 'androidx.preference:preference:1.1.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.4'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.0'

    implementation 'com.google.dagger:hilt-android:2.44'
    kapt 'com.google.dagger:hilt-compiler:2.44'

    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.5.1'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.5.1'
    implementation 'androidx.activity:activity-ktx:1.5.1'
    implementation 'androidx.fragment:fragment-ktx:1.5.1'

    implementation 'androidx.navigation:navigation-fragment-ktx:2.5.3'
    implementation 'androidx.navigation:navigation-ui-ktx:2.5.3'

    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.github.evrencoskun:TableView:v0.8.9.4'
    implementation 'com.github.Dhaval2404:ColorPicker:2.3'
    implementation 'com.github.dhaval2404:imagepicker:2.1'
    implementation 'com.github.amlcurran.showcaseview:library:5.4.3'
    implementation 'io.github.igreenwood.loupe:loupe:1.2.2'
    implementation 'io.github.igreenwood.loupe:extensions:1.0.1'
    implementation "jp.wasabeef:recyclerview-animators:4.0.2"
    implementation 'com.github.abhishekti7:UnicornFilePicker:1.0.2'
    implementation 'com.github.atwa:filepicker:1.0.7'
    implementation "moe.feng:MaterialStepperView:0.2.4.2"
    implementation "com.github.JDevZone:FillProgressLayout:v0.0.9"
    implementation "it.xabaras.android:recyclerview-swipedecorator:1.4"
    implementation "com.github.leandroborgesferreira:loading-button-android:2.3.0"

    stableImplementation "com.crowdfire.cfalertdialog:cfalertdialog:1.3.1"
}